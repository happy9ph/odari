services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hodari
      POSTGRES_PASSWORD: hodari
      POSTGRES_DB: hodari
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hodari -d hodari"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://hodari:hodari@db:5432/hodari
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["${PORT:-8080}:80"]
    depends_on: [backend]
volumes:
  pgdata:
